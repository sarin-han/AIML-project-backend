services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      # 비워 두면 backend/data/clipcraft.db(SQLite). PostgreSQL을 쓰려면 postgresql://사용자:비밀번호@호스트:5432/clipcraft
      DATABASE_URL: ${DATABASE_URL:-}
      GPU_SERVER_URL: ${GPU_SERVER_URL:-http://host.docker.internal:8001}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  frontend:
    build:
      context: ./clipcraft-web
      dockerfile: Dockerfile
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_ANALYZE_API_URL: /analyze
      VITE_BACKEND_URL: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-5174}:5173"
    volumes:
      - ./clipcraft-web:/app
      - /app/node_modules
    depends_on:
      - backend

  ngrok:
    image: ngrok/ngrok:latest
    profiles: ["tunnel"]
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    command: http frontend:5173
    ports:
      - "4040:4040"
    depends_on:
      - frontend
