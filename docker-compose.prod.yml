# 운영 배포용: docker compose -f docker-compose.prod.yml up -d --build
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      GPU_SERVER_URL: ${GPU_SERVER_URL:-http://host.docker.internal:8001}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "8000"

  frontend:
    build:
      context: ./clipcraft-web
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend
